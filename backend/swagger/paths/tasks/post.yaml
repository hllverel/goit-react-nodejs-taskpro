tags:
  - Tasks
summary: Create a task
operationId: createTask
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../swagger/components/schemas/createTask.yaml'
responses:
  '201':
    description: Task created successfully
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Kart başarıyla oluşturuldu!
            data:
              $ref: '../../../swagger/components/schemas/task.yaml'
  '401':
    $ref: '../../../swagger/components/responses/401.yaml'
